version: 1.3.11
cache: true

# === LIMITE DI SPESA PER MEMBRO (~3 $/mese) ===
# 1.000.000 crediti ≈ 1 $  →  3.000.000 ≈ 3 $/mese
balance:
  enabled: true
  startBalance: 3000000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: "days"
  refillAmount: 3000000

# === AGENT ===
# NB: il blocco 'create' per i soli USER viene fatto dall'Admin Panel post-login,
# perché LibreChat non supporta permissions per-ruolo nel yaml (vedi issue #12306).
interface:
  agents:
    use: true
  # Link "Top up credits" mostrato nel footer dell'app (utenti loggati).
  # Pagina ricarica crediti Stripe (servizio Railway "topup").
  customFooter: "[Top up credits](https://topup-production-3dcb.up.railway.app) | Faggioli AI — Publishing Incubator"

# === Capacità degli agent (knowledge base / file upload) ===
endpoints:
  agents:
    capabilities:
      - "file_search"
      - "context"
      - "tools"
      - "actions"
